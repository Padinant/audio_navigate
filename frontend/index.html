<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Audio Guide</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Campus Audio Guide</h1>
    <p class="intro">
      Turn on the camera to show your surroundings, then use the microphone to ask a question.
    </p>

    <section aria-labelledby="camera-heading">
      <h2 id="camera-heading">Camera</h2>

      <video id="camera" autoplay playsinline muted aria-label="Camera preview"></video>

      <button id="cameraButton" type="button">
        Camera On
      </button>
    </section>

    
    <input id="testImageInput" type="file" accept="image/*">
    <img id="testImagePreview" alt="Selected test image preview">
    
    <section aria-labelledby="mic-heading">
      <h2 id="mic-heading">Ask a Question</h2>

      <button id="micButton" type="button">
        Start Microphone
      </button>

      <p id="status" role="status" aria-live="polite">
        Microphone is off.
      </p>

      <label for="question">Your question</label>
      <textarea
        id="question"
        rows="4"
        placeholder="Your spoken question will appear here..."
      ></textarea>

      <button id="askButton" type="button">
        Ask
      </button>
    </section>

    <section aria-labelledby="answer-heading">
      <h2 id="answer-heading">Answer</h2>
      <div id="answer" class="answer" aria-live="polite">
        No answer yet.
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
