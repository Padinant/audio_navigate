<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PathVoice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>PathVoice</h1>
        <p>Audio Navigation Assistant</p>
    </header>

    <main>

        <section class="welcome">
            <h2>Welcome to PathVoice</h2>

            <p>
                A voice-first navigation assistant designed
                to help people navigate unfamiliar spaces.
            </p>

            <button id="startButton">
                Start PathVoice
            </button>
        </section>

        <section class="status">
            <h2>System Status</h2>

            <p id="statusMessage">
                PathVoice is ready.
            </p>
        </section>

    </main>

    <footer>
        <p>PathVoice — Hackathon Prototype</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
